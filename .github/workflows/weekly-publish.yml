name: Weekly article publish (disabled)

# Weekly publishing is owned by the Replit API server. The server's
# content scheduler polls the Replit development database and the publisher
# runs in the same environment, so GitHub Actions must not attempt to use the
# internal development database hostname.
on:
  workflow_dispatch:

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Weekly publishing runs in the Replit API server."